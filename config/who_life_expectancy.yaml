# Dataset configuration for the Life Expectancy Predictor.
#
# This file holds ALL the knowledge that is specific to one particular CSV:
# which columns exist, how to rename messy headers, which values secretly
# mean "missing", how to handle outliers, which columns are model
# predictors, and how to label them.
#
# data_prep.py and train_model.py contain none of this -- they just read
# whichever config is pointed at. To point the project at a different (but similarly-shaped) WHO-style CSV, copy this file,
# edit the values below to match the new CSV's columns, and re-run
# `python train_model.py config/your_new_config.yaml`.

dataset:
  name: "WHO Life Expectancy"
  description: >
    World Health Organization / UN life expectancy and health indicators,
    covering roughly 193 countries from 2000 to 2015.
  source_csv: "data/Life_Expectancy_WHO_Data.csv"

# Columns that identify a row but are NOT model features (kept for
# grouping and reporting, not fed to the model).
id_columns: ["Country", "Year", "Status"]

# The column the model predicts.
target_column: "Life_Expectancy"

# Raw CSV headers are first auto-normalized (stripped, title-cased, spaces
# -> underscores). This map catches cases where that automatic pass gives
# an awkward result and you want a cleaner final name.
column_renames:
  "Thinness_1-19_Years": "Thinness_10-19_Years"
  "Percentage_Expenditure": "Pct_Expenditure"
  "Total_Expenditure": "Ttl_Expend"
  "Bmi": "BMI"
  "Gdp": "GDP"
  "Hiv/Aids": "HIV_AIDS"
  "Income_Composition_Of_Resources": "Income_Comp_Of_Resources"

# Values that are technically present but really mean "missing data".
implicit_nulls:
  # A literal 0 in these columns is treated as missing rather than a true zero.
  zero_as_null: ["Infant_Deaths", "Under-Five_Deaths"]
  # Values outside [low, high] in these columns are treated as missing.
  range_as_null:
    BMI: [10, 50]

# How missing values get filled in: interpolate within each entity's own
# time series first (e.g. each country's own trend over years), falling
# back to that entity's median, then the overall column median.
interpolation:
  group_column: "Country"
  sort_columns: ["Country", "Year"]

# Winsorization limits per feature: [lower_pct, upper_pct] trimmed from
# each tail to reduce the influence of extreme outliers.
winsorize_limits:
  Life_Expectancy: [0.01, 0.0]
  Adult_Mortality: [0.0, 0.03]
  Infant_Deaths: [0.0, 0.10]
  Alcohol: [0.0, 0.01]
  Pct_Expenditure: [0.0, 0.13]
  Hepatitis_B: [0.11, 0.0]
  Measles: [0.0, 0.19]
  Under-Five_Deaths: [0.0, 0.11]
  Polio: [0.10, 0.0]
  Ttl_Expend: [0.0, 0.02]
  Diphtheria: [0.10, 0.0]
  HIV_AIDS: [0.0, 0.16]
  GDP: [0.0, 0.13]
  Population: [0.0, 0.15]
  Thinness_10-19_Years: [0.0, 0.04]
  Thinness_5-9_Years: [0.0, 0.04]
  Income_Comp_Of_Resources: [0.05, 0.0]
  Schooling: [0.02, 0.01]

# Columns dropped before training -- either highly collinear with other
# predictors, or (BMI) too sparse to trust.
drop_columns:
  - Thinness_5-9_Years
  - GDP
  - Infant_Deaths
  - Population
  - BMI

# The model's predictors, with a readable label and description for each.
predictors:
  - column: Adult_Mortality
    label: "Adult Mortality (per 1,000 adults)"
    description: "Probability of dying between ages 15-60, per 1,000 population. Higher = worse."
  - column: HIV_AIDS
    label: "HIV/AIDS deaths (per 1,000, ages 0-4)"
    description: "Deaths per 1,000 live births caused by HIV/AIDS, ages 0-4."
  - column: Under-Five_Deaths
    label: "Under-Five Deaths (per 1,000)"
    description: "Deaths per 1,000 population among children under age 5."
  - column: Polio
    label: "Polio immunization (%)"
    description: "% of 1-year-olds immunized against polio."
  - column: Diphtheria
    label: "Diphtheria (DTP3) immunization (%)"
    description: "% of 1-year-olds immunized against diphtheria (DTP3 vaccine)."
  - column: Hepatitis_B
    label: "Hepatitis B immunization (%)"
    description: "% of 1-year-olds immunized against Hepatitis B."
  - column: Thinness_10-19_Years
    label: "Thinness, ages 10-19 (%)"
    description: "% of 10-19 year-olds classified as underweight (thin) for their age."
  - column: Alcohol
    label: "Alcohol consumption (litres/capita)"
    description: "Liters of pure alcohol consumed per capita (age 15+ population)."
  - column: Pct_Expenditure
    label: "Health expenditure (% of GDP per capita)"
    description: "Health expenditure as a percentage of GDP per capita."
  - column: Ttl_Expend
    label: "Total govt. health expenditure (% of total govt. expenditure)"
    description: "Total government health spending as a percentage of total government spending."
  - column: Income_Comp_Of_Resources
    label: "Income Composition of Resources (0-1 index)"
    description: >
      A UN Human Development Index sub-component (0-1 scale) capturing how
      effectively a country converts income into human development
      outcomes. Higher = more effective.
  - column: Schooling
    label: "Schooling (avg. years)"
    description: "Average number of years of schooling completed."
  - column: Measles
    label: "Measles cases (reported per 1,000)"
    description: "Number of reported measles cases per 1,000 population."

model:
  type: random_forest
  n_estimators: 200
  random_state: 42
  test_size: 0.2
